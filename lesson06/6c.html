<!DOCTYPE html>
<html>
  <head>
    <title>Practicing Booleans Part 3</title>
  </head>
  <body>
    <script>
      const hour = 14;
      const name = 'Anmol Chaudhary';

      if(hour >= 6 && hour < 12) {
        console.log(`Good Morning ${name}!`);
      }
      else if(hour >= 12 && hour < 17) {
        console.log(`Good Afternoon ${name}!`);
      }
      else {
        console.log(`Good Night ${name}!`);
      }
    </script>
  </body>
</html>
