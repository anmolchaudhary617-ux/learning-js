<!DOCTYPE html>
<html>

<head>
  <title>Practicing functions Part 1-3</title>
</head>

<body>
  <script>
    function greet(name) {
      if (name) {
        console.log(`Hello ${name}!`)
      }
      else {
        console.log('Hi there!');
      }
    }

    greet();
  </script>
</body>

</html>
