<!DOCTYPE html>
<html>
  <head>
    <title>Practicing DOM part 4</title>
  </head>
  <body>
    <input type="text" placeholder="Name">
    <button onclick="
      textDisplay();
    ">
      Submit
    </button>
    <p></p> 
  </body>
  <script>
    function textDisplay() {
      const text = document.querySelector('input').value;
      document.querySelector('p').innerHTML = `Your name is ${text}`;
    }
  </script>
</html>
