<!DOCTYPE html>
<html>
  <head>
    <title>Practicing DOM Part 9</title>
  </head>
  <body>
    <p>
      <button onclick="
        updateCalculation('1');
      ">1</button>

      <button onclick="
        updateCalculation('2');
      ">2</button>

      <button onclick="
        updateCalculation('3');
      ">3</button>

      <button onclick="
        updateCalculation(' + ');
      ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      ">4</button>

      <button onclick="
        updateCalculation('5');
      ">5</button>

      <button onclick="
        updateCalculation('6');
      ">6</button>

      <button onclick="
        updateCalculation(' - ');
      ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      ">7</button>

      <button onclick="
        updateCalculation('8');
      ">8</button>

      <button onclick="
        updateCalculation('9');
      ">9</button>

      <button onclick="
        updateCalculation(' * ');
      ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      ">0</button>

      <button onclick="
        updateCalculation('.');
      ">.</button>

      <button onclick="
      calculation = eval(calculation);
      showCalculation(calculation);
        localStorage.setItem('calculation', calculation);
      ">=</button>

      <button onclick="
        updateCalculation(' / ');
      ">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';
        showCalculation(calculation);
        localStorage.setItem('calculation', calculation);
      ">Clear</button>
    </p>

    <p class="displayOnPage"></p>
    <script>
      let calculation = localStorage.getItem('calculation') || '';

      if(calculation) {
        showCalculation(calculation);
      }

      function updateCalculation(value) {
        calculation += value;
        
        showCalculation(calculation);
        localStorage.setItem('calculation', calculation);
      }

      function showCalculation(calculation) {
        document.querySelector('.displayOnPage').innerHTML = calculation ;
      }
    </script>
  </body>
</html>
