<!--This micro project is an improved version of rock-paper-scissors.html as it includes the use of objects-->
<!DOCTYPE html>
<html>

<head></head>

<body>
  <p>Rock Paper Scissors</p>
  <button onclick="
    playGame('rock');
    ">
    Rock
  </button>
  <button onclick="
    playGame('paper');
    ">
    Paper
  </button>
  <button onclick="
    playGame('scissors');
    ">
    Scissors
  </button>
  <button onclick="
    scoreCount.losscount = 0;
    scoreCount.wincount = 0;
    scoreCount.tiecount = 0;
    localStorage.removeItem('score');
    updateScore();
  ">
    Reset Score
  </button>

  <p class="js-moves"></p>
  <p class="js-result"></p>
  <p class="js-history"></p>

  <script>
    const scoreCount = JSON.parse(localStorage.getItem('score')) || {
      wincount: 0,
      losscount: 0,
      tiecount: 0
    }

    updateScore();

    function playGame(playerMove) {

      const randomNumber = Math.random();
      let computerMove = '';
      let result = '';
      if (randomNumber > 0 && randomNumber <= 1 / 3) {
        computerMove = 'rock';
      }
      else if (randomNumber > 1 / 3 && randomNumber <= 2 / 3) {
        computerMove = 'paper';
      }
      else {
        computerMove = 'scissors';
      }

      document.querySelector('.js-moves').innerHTML = `YOU: ${playerMove}  VS  COMPUTER: ${computerMove}`;

      if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'Tie';
        }
        else if (computerMove === 'paper') {
          result = 'You lose';
        }
        else {
          result = 'You win';
        }
      }
      else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          result = 'You win';
        }
        else if (computerMove === 'paper') {
          result = 'Tie';
        }
        else {
          result = 'You lose';
        }
      }
      else {
        if (computerMove === 'rock') {
          result = 'You lose';
        }
        else if (computerMove === 'paper') {
          result = 'You win';
        }
        else {
          result = 'Tie';
        }
      }

      document.querySelector('.js-result').innerHTML = result;

      if (result === 'You win') {
        scoreCount.wincount++;
      }
      else if (result === 'You lose') {
        scoreCount.losscount++;
      }
      else {
        scoreCount.tiecount++;
      }

      localStorage.setItem('score', JSON.stringify(scoreCount));

      updateScore();
    }

    function updateScore() {
      document.querySelector('.js-history').innerHTML = `Wins: ${scoreCount.wincount} Losses: ${scoreCount.losscount} Ties: ${scoreCount.tiecount}`;
    }
  </script>
</body>

</html>
