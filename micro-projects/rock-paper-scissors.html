<!DOCTYPE html>
<html>

<head>
  <title>Rock-Paper-Scissors Project</title>
</head>

<body>
  <p>Rock Paper Scissors</p>
  <button onclick="
    playGame('rock');
    ">
    Rock
  </button>
  <button onclick="
    playGame('paper');
    ">
    Paper
  </button>
  <button onclick="
    playGame('scissors');
    ">
    Scissors
  </button>

  <script>

    function playGame(playerMove) {

      const randomNumber = Math.random();
      let computerMove = '';

      if (randomNumber > 0 && randomNumber <= 1 / 3) {
        computerMove = 'rock';
      }
      else if (randomNumber > 1 / 3 && randomNumber <= 2 / 3) {
        computerMove = 'paper';
      }
      else {
        computerMove = 'scissors';
      }

      if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. Tie.`);
        }
        else if (computerMove === 'paper') {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. You lose.`);
        }
        else {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. You win.`);
        }
      }
      else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. You win.`);
        }
        else if (computerMove === 'paper') {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. Tie.`);
        }
        else {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. You lose.`);
        }
      }
      else {
        if (computerMove === 'rock') {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. You lose.`);
        }
        else if (computerMove === 'paper') {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. You win.`);
        }
        else {
          alert(`You chose ${playerMove}. Computer chose ${computerMove}. Tie.`);
        }
      }
    }
  </script>
</body>

</html>
