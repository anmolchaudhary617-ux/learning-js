<!DOCTYPE html>
<html>

<head>
  <title>Practicing all 3 languages together Part 7</title>
  <link rel="stylesheet" href="10i.css">
</head>

<body>
  <div class="calculator">
    <div>
      <p class="displayOnPage"></p>
    </div>
    <div>
      <button class="general-button" onclick="
        updateCalculation('1');
      ">1</button>

      <button class="general-button" onclick="
        updateCalculation('2');
      ">2</button>

      <button class="general-button" onclick="
        updateCalculation('3');
      ">3</button>

      <button class="operation-button" onclick="
        updateCalculation(' + ');
      ">+</button>
    </div>

    <div>
      <button class="general-button" onclick="
        updateCalculation('4');
      ">4</button>

      <button class="general-button" onclick="
        updateCalculation('5');
      ">5</button>

      <button class="general-button" onclick="
        updateCalculation('6');
      ">6</button>

      <button class="operation-button" onclick="
        updateCalculation(' - ');
      ">-</button>
    </div>

    <div>
      <button class="general-button" onclick="
        updateCalculation('7');
      ">7</button>

      <button class="general-button" onclick="
        updateCalculation('8');
      ">8</button>

      <button class="general-button" onclick="
        updateCalculation('9');
      ">9</button>

      <button class="operation-button" onclick="
        updateCalculation(' * ');
      ">*</button>
    </div>

    <div>
      <button class="general-button" onclick="
        updateCalculation('0');
      ">0</button>

      <button class="general-button" onclick="
        updateCalculation('.');
      ">.</button>

      <button class="general-button" onclick="
      calculation = eval(calculation);
      showCalculation(calculation);
      localStorage.setItem('calculation', calculation);
      ">=</button>

      <button class="operation-button" onclick="
        updateCalculation(' / ');
      ">/</button>
    </div>

    <div>
      <button class="clear-button" onclick="
        calculation = '';
        showCalculation(calculation);
        localStorage.setItem('calculation', calculation);
      ">Clear</button>
    </div>
  </div>
  <script src="10i.js"></script>
</body>

</html>
