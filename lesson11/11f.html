<!DOCTYPE html>
<html>

<head>
  <title>Practicing Loops Part 3</title>
</head>

<body>
  <script>
    console.log('PART - 1');
    let i = 0;
    let j = 5;
    while(i <= 5) {
      console.log(2 * i);
      i++;
    }
    console.log('PART - 2');
    while(j >= 0) {
      console.log(j);
      j--;
    }
  </script>
</body>

</html>
