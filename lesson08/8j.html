<!DOCTYPE html>
<html>

<head></head>

<body>
  <button onclick="
    playgame('Heads');
  ">
    heads
  </button>
  <button onclick="
    playgame('Tails');
  ">
    tails
  </button>
  <script>
    let score = {
      wins: 0,
      losses: 0
    }

    function playgame(guess) {
      const randomNumber = Math.random();
      const coinToss = (randomNumber < 0.5) ? 'Heads' : 'Tails';
      let result = '';

      guess === coinToss ? result = 'You win!' : result = 'You lose!';
      
      if(result === 'You win') {
        score.wins++;
      }
      else score.losses++;

      console.log(result);
      console.log(score);
    }
  </script>
</body>

</html>
