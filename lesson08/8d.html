<!DOCTYPE html>
<html>
  <head>
    <title>Practicing Objects Part 4</title>
  </head>
  <body>
    <script>
      const product1 = {
        name: 'basketball',
        price: 2095
      }

      const product2 = {
        name: 'volleyball',
        price: 1640
      }

      function comparePrice(product1, product2) {
        if(product1.price > product2.price) {
          return product2;
        }
        else if(product1.price < product2.price) {
          return product1;
        }
        else {
          return product1;
        }
      }

      console.log(comparePrice(product1, product2));
    </script>
  </body>
</html>
